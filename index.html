<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECUR - Review Manager</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2b2621;
            --text-sub: #8c8279;
            --border: #e6e2db;
            --accent: #5c4b41;
            --accent-hover: #4a3c34;
            --danger: #c85a53;
            --success: #5a8a62;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-weight: 700;
            color: var(--accent);
        }

        .date-display {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* 統計サマリーパネル */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .stat-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* ナビゲーションタブ */
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            background: #ede8e1;
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* カード・UIパーツ */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* アニメーションボタン */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }
        .btn-primary:active {
            background-color: var(--accent-hover);
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-complete {
            background-color: var(--accent);
            color: white;
            flex: 2;
        }

        .btn-postpone {
            background-color: #f2eee9;
            color: var(--text-main);
            flex: 1;
            border: 1px solid var(--border);
        }

        /* 5段階評価パネル */
        .rating-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .rating-prompt {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .rating-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-rate {
            flex: 1;
            padding: 8px 0;
            background: #faf8f5;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-rate:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* グラフエリア */
        .chart-container {
            margin-top: 12px;
            padding: 12px;
            background: #faf8f5;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .chart-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 60px;
            padding-top: 10px;
            border-bottom: 1px solid var(--border);
        }

        .chart-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }

        .chart-bar-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: #faf8f5;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--accent);
        }

        /* タスクカード情報 */
        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .task-title:hover {
            color: var(--accent);
        }

        .task-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }
        .badge-today { background: #edf4ee; color: var(--success); }
        .badge-overdue { background: #fdf2f1; color: var(--danger); }
        .badge-future { background: #f2eee9; color: var(--text-sub); }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 30px 0;
            font-size: 0.9rem;
        }

        /* カレンダービュー */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-nav button {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-bottom: 16px;
        }
        .cal-day-header {
            font-size: 0.75rem;
            color: var(--text-sub);
            padding: 4px 0;
        }
        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #faf8f5;
            border: 1px solid transparent;
            position: relative;
        }
        .cal-cell.has-task::after {
            content: '';
            width: 5px;
            height: 5px;
            background-color: var(--accent);
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
        }
        .cal-cell.selected {
            border-color: var(--accent);
            font-weight: bold;
            background: #f2eee9;
        }
        .cal-cell.other-month {
            color: #d1cbc3;
        }

        .delete-text {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 0;
        }

        .preset-tag {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background: #faf8f5;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">RECUR</div>
        <div class="date-display" id="header-date"></div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('today')">今日</button>
        <button class="tab-btn" onclick="switchTab('calendar')">カレンダー</button>
        <button class="tab-btn" onclick="switchTab('add')">新規作成</button>
        <button class="tab-btn" onclick="switchTab('presets')">間隔設定</button>
        <button class="tab-btn" onclick="switchTab('list')">一覧</button>
    </div>

    <!-- 今日の復習画面 -->
    <div id="view-today" class="view-section active">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">RETENTION</div>
                <div class="stat-value" id="stat-retention">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BACKLOG</div>
                <div class="stat-value" id="stat-backlog">0</div>
            </div>
        </div>

        <div id="today-task-list"></div>
    </div>

    <!-- カレンダー画面 -->
    <div id="view-calendar" class="view-section">
        <div class="card">
            <div class="calendar-nav">
                <button class="btn" style="width:auto;" onclick="changeMonth(-1)">&lt;</button>
                <span id="cal-month-title" style="font-weight: 600;"></span>
                <button class="btn" style="width:auto;" onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
        <div class="card">
            <h3 id="selected-date-title" style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-sub);">日付を選択してください</h3>
            <div id="calendar-day-tasks"></div>
        </div>
    </div>

    <!-- 新規作成画面 -->
    <div id="view-add" class="view-section">
        <div class="card">
            <div class="form-group">
                <label>タスク名</label>
                <input type="text" id="task-name" placeholder="例：英単語 / 第3章の復習">
            </div>
            <div class="form-group">
                <label>開始日（復習をスタートする日）</label>
                <input type="date" id="task-start-date">
            </div>
            <div class="form-group">
                <label>復習間隔プリセットを選択</label>
                <select id="task-preset-select"></select>
            </div>
            <button class="btn btn-primary" onclick="createTask()">タスクを追加する</button>
        </div>
    </div>

    <!-- プリセット管理画面 -->
    <div id="view-presets" class="view-section">
        <div class="card">
            <h3 style="font-size: 0.95rem; margin-bottom: 12px;">新しい間隔プリセットを追加</h3>
            <div class="form-group">
                <label>プリセット名</label>
                <input type="text" id="preset-name" placeholder="例：じっくりコース、暗記用など">
            </div>
            <div class="form-group">
                <label>復習間隔（日数をカンマ区切りで入力）</label>
                <input type="text" id="preset-intervals" placeholder="例: 1, 3, 7, 14, 30">
            </div>
            <button class="btn btn-primary" onclick="createPreset()">プリセットを保存</button>
        </div>
        <div class="card">
            <h3 style="font-size: 0.95rem; margin-bottom: 12px;">登録済みのプリセット</h3>
            <div id="preset-list"></div>
        </div>
    </div>

    <!-- 全タスク管理画面 -->
    <div id="view-list" class="view-section">
        <div id="all-task-list"></div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('recur_db')) || {
            presets: [
                { id: 'p1', name: 'スタンダード (1, 3, 7, 14, 30日)', intervals: [1, 3, 7, 14, 30] },
                { id: 'p2', name: '短期集中 (1, 2, 4, 7日)', intervals: [1, 2, 4, 7] }
            ],
            tasks: []
        };

        let currentDate = new Date();
        let selectedDateStr = formatDateStr(new Date());

        function saveData() {
            localStorage.setItem('recur_db', JSON.stringify(db));
        }

        function formatDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function addDays(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            date.setDate(date.getDate() + days);
            return formatDateStr(date);
        }

        window.onload = function() {
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-US', options);
            
            // 新規作成画面の開始日の初期値を「今日」に設定
            const startDateInput = document.getElementById('task-start-date');
            if (startDateInput) {
                startDateInput.value = formatDateStr(new Date());
            }

            renderAll();
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            const tabMap = { today: 0, calendar: 1, add: 2, presets: 3, list: 4 };
            document.querySelectorAll('.tab-btn')[tabMap[tabName]].classList.add('active');
            document.getElementById(`view-${tabName}`).classList.add('active');
            
            // 新規作成タブを開いたとき、開始日が空なら今日を入れる
            if (tabName === 'add') {
                const startDateInput = document.getElementById('task-start-date');
                if (startDateInput && !startDateInput.value) {
                    startDateInput.value = formatDateStr(new Date());
                }
            }

            renderAll();
        }

        function updateStats() {
            const today = formatDateStr(new Date());
            const backlogTasks = db.tasks.filter(t => t.nextDate < today);
            document.getElementById('stat-backlog').textContent = backlogTasks.length;

            let retention = 100;
            if (db.tasks.length > 0) {
                let totalRatings = 0;
                let ratingCount = 0;
                db.tasks.forEach(t => {
                    if (t.ratings && t.ratings.length > 0) {
                        t.ratings.forEach(r => { totalRatings += r; ratingCount++; });
                    }
                });
                const avgRatingBonus = ratingCount > 0 ? (totalRatings / ratingCount) * 5 : 75;
                const overduePenalty = backlogTasks.length * 6;
                retention = Math.min(100, Math.max(20, Math.round(avgRatingBonus - overduePenalty + 30)));
            }
            document.getElementById('stat-retention').textContent = `${retention}%`;
        }

        function createPreset() {
            const nameInput = document.getElementById('preset-name');
            const intervalsInput = document.getElementById('preset-intervals');
            const name = nameInput.value.trim();
            const rawIntervals = intervalsInput.value.trim();

            if (!name || !rawIntervals) {
                alert('名称と間隔の両方を入力してください');
                return;
            }

            const intervals = rawIntervals.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0);
            if (intervals.length === 0) {
                alert('有効な日数をカンマ区切りで入力してください（例: 1, 3, 7）');
                return;
            }

            db.presets.push({
                id: Date.now().toString(),
                name: name,
                intervals: intervals
            });

            saveData();
            nameInput.value = '';
            intervalsInput.value = '';
            renderAll();
            alert('新しいプリセットを追加しました！');
        }

        function deletePreset(id) {
            if (db.presets.length <= 1) {
                alert('最低1つはプリセットが必要です');
                return;
            }
            if (confirm('このプリセットを削除しますか？')) {
                db.presets = db.presets.filter(p => p.id !== id);
                saveData();
                renderAll();
            }
        }

        function renderPresets() {
            const select = document.getElementById('task-preset-select');
            if (select) {
                select.innerHTML = db.presets.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${p.intervals.join('日 → ')}日後)</option>`).join('');
            }

            const list = document.getElementById('preset-list');
            if (list) {
                list.innerHTML = db.presets.map(p => `
                    <div class="preset-tag">
                        <div>
                            <strong>${escapeHtml(p.name)}</strong><br>
                            <span style="font-size:0.75rem; color:var(--text-sub);">${p.intervals.join('日 → ')}日後</span>
                        </div>
                        <button class="delete-text" onclick="deletePreset('${p.id}')">削除</button>
                    </div>
                `).join('');
            }
        }

        function createTask() {
            const nameInput = document.getElementById('task-name');
            const name = nameInput.value.trim();
            if (!name) return alert('タスク名を入力してください');

            const startDateInput = document.getElementById('task-start-date');
            const startDate = startDateInput.value;
            if (!startDate) return alert('開始日を選択してください');

            const presetId = document.getElementById('task-preset-select').value;
            const preset = db.presets.find(p => p.id === presetId);
            if (!preset) return alert('プリセットを選択してください');

            const newTask = {
                id: Date.now().toString(),
                name: name,
                intervals: preset.intervals,
                currentStep: 1,
                nextDate: addDays(startDate, preset.intervals[0]), // 最初の復習日は「開始日 ＋ プリセットの最初の日数」
                ratings: [],
                isRatingMode: false,
                showChart: false
            };

            db.tasks.push(newTask);
            saveData();
            nameInput.value = '';
            startDateInput.value = formatDateStr(new Date());
            switchTab('today');
        }

        function toggleChart(id) {
            const task = db.tasks.find(t => t.id === id);
            if (!task) return;
            task.showChart = !task.showChart;
            renderAll();
        }

        function promptRating(id) {
            const task = db.tasks.find(t => t.id === id);
            if (!task) return;
            task.isRatingMode = true;
            renderToday();
        }

        function completeWithRating(id, rating) {
            const task = db.tasks.find(t => t.id === id);
            if (!task) return;

            if (!task.ratings) task.ratings = [];
            task.ratings.push(rating);

            const multiplier = rating / 3;

            task.currentStep++;
            if (task.currentStep > task.intervals.length) {
                db.tasks = db.tasks.filter(t => t.id !== id);
            } else {
                const baseInterval = task.intervals[task.currentStep - 1];
                const adjustedInterval = Math.max(1, Math.round(baseInterval * multiplier));
                task.nextDate = addDays(formatDateStr(new Date()), adjustedInterval);
                task.isRatingMode = false;
                task.showChart = true;
            }

            saveData();
            renderAll();
        }

        function postponeTask(id) {
            const task = db.tasks.find(t => t.id === id);
            if (!task) return;
            task.nextDate = addDays(task.nextDate, 1);
            saveData();
            renderAll();
        }

        function deleteTask(id) {
            if (confirm('このタスクを削除しますか？')) {
                db.tasks = db.tasks.filter(t => t.id !== id);
                saveData();
                renderAll();
            }
        }

        function renderAll() {
            updateStats();
            renderPresets();
            renderToday();
            renderCalendar();
            renderList();
        }

        function renderRatingChart(task) {
            if (!task.ratings || task.ratings.length === 0) {
                return `<div class="chart-container"><div class="chart-title">定着度履歴 (まだ評価がありません)</div></div>`;
            }

            const barsHtml = task.ratings.map((r, index) => {
                const heightPercent = (r / 5) * 100;
                return `
                    <div class="chart-bar-wrap">
                        <div class="chart-bar" style="height: ${heightPercent}%;"></div>
                        <div class="chart-bar-label">${r}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="chart-container">
                    <div class="chart-title">
                        <span>定着度の推移 (全${task.ratings.length}回)</span>
                        <span>★平均: ${(task.ratings.reduce((a, b) => a + b, 0) / task.ratings.length).toFixed(1)}</span>
                    </div>
                    <div class="chart-bars">
                        ${barsHtml}
                    </div>
                </div>
            `;
        }

        function renderToday() {
            const container = document.getElementById('today-task-list');
            const today = formatDateStr(new Date());
            const targetTasks = db.tasks.filter(t => t.nextDate <= today);

            if (targetTasks.length === 0) {
                container.innerHTML = `<div class="empty-state">本日の復習タスクはありません。素晴らしい状態です。</div>`;
                return;
            }

            container.innerHTML = targetTasks.map(task => {
                const isOverdue = task.nextDate < today;
                const badgeClass = isOverdue ? 'badge-overdue' : 'badge-today';
                const badgeText = isOverdue ? `期限切れ (${task.nextDate})` : '今日予定';

                let content = '';
                if (task.isRatingMode) {
                    content = `
                        <div class="rating-box">
                            <div class="rating-prompt">今日の定着度（5段階）を選んでください</div>
                            <div class="rating-buttons">
                                <button class="btn-rate" onclick="completeWithRating('${task.id}', 1)">1</button>
                                <button class="btn-rate" onclick="completeWithRating('${task.id}', 2)">2</button>
                                <button class="btn-rate" onclick="completeWithRating('${task.id}', 3)">3</button>
                                <button class="btn-rate" onclick="completeWithRating('${task.id}', 4)">4</button>
                                <button class="btn-rate" onclick="completeWithRating('${task.id}', 5)">5</button>
                            </div>
                        </div>
                    `;
                } else {
                    content = `
                        <div class="task-meta">
                            <span>段階: ${task.currentStep}回目 / 全${task.intervals.length}回</span>
                            ${task.ratings && task.ratings.length > 0 ? `<span>直近: ★${task.ratings[task.ratings.length-1]}</span>` : ''}
                        </div>
                        <div class="task-actions">
                            <button class="btn btn-complete" onclick="promptRating('${task.id}')">完了</button>
                            <button class="btn btn-postpone" onclick="postponeTask('${task.id}')">明日に回す</button>
                        </div>
                    `;
                }

                return `
                    <div class="card">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <div class="task-title" onclick="toggleChart('${task.id}')">${escapeHtml(task.name)} <span style="font-size:0.7rem; color:var(--text-sub);">📊 グラフ</span></div>
                        ${task.showChart ? renderRatingChart(task) : ''}
                        ${content}
                    </div>
                `;
            }).join('');
        }

        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('cal-month-title').textContent = `${year}年 ${month + 1}月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = `
                <div class="cal-day-header">日</div><div class="cal-day-header">月</div>
                <div class="cal-day-header">火</div><div class="cal-day-header">水</div>
                <div class="cal-day-header">木</div><div class="cal-day-header">金</div>
                <div class="cal-day-header">土</div>
            `;

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="cal-cell other-month"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const dateStr = `${year}-${mStr}-${dStr}`;
                const hasTask = db.tasks.some(t => t.nextDate === dateStr);
                const isSelected = selectedDateStr === dateStr;

                grid.innerHTML += `
                    <div class="cal-cell ${hasTask ? 'has-task' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate('${dateStr}')">
                        ${day}
                    </div>
                `;
            }
            renderCalendarDayTasks();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
        }

        function renderCalendarDayTasks() {
            const title = document.getElementById('selected-date-title');
            const container = document.getElementById('calendar-day-tasks');
            title.textContent = `${selectedDateStr} の予定タスク`;

            const tasks = db.tasks.filter(t => t.nextDate === selectedDateStr);
            if (tasks.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 16px 0;">この日に予定されているタスクはありません</div>`;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div style="padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-weight: 600; font-size: 0.95rem;">${escapeHtml(task.name)}</div>
                        <div style="font-size: 0.75rem; color: var(--text-sub);">段階: ${task.currentStep}回目</div>
                    </div>
                </div>
            `).join('');
        }

        function renderList() {
            const container = document.getElementById('all-task-list');
            if (db.tasks.length === 0) {
                container.innerHTML = `<div class="empty-state">登録されたタスクはありません。</div>`;
                return;
            }

            const today = formatDateStr(new Date());

            container.innerHTML = db.tasks.map(task => {
                const isFuture = task.nextDate > today;
                return `
                    <div class="card">
                        <div class="task-title" onclick="toggleChart('${task.id}')">${escapeHtml(task.name)} <span style="font-size:0.7rem; color:var(--text-sub);">📊 グラフ</span></div>
                        ${task.showChart ? renderRatingChart(task) : ''}
                        <div class="task-meta" style="margin-top: 8px;">
                            <span>次回予定: ${task.nextDate} (${task.currentStep}/${task.intervals.length}回目)</span>
                            <button class="delete-text" onclick="deleteTask('${task.id}')">削除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&'`<>"]/g, m => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
        }
    </script>
</body>
</html>
