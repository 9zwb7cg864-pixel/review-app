<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBBING - Review Manager</title>
    <style>
        :root {
            --bg-color: #f4f3ef;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            --border: #e5e5ea;
            --accent: #2c2c2e;
            --accent-hover: #3a3a3c;
            --danger: #ff3b30;
            --success: #34c759;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--text-sub);
        }

        .date-display {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* ナビゲーションタブ */
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            background: #e9e8e4;
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* カード・UIパーツ */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* ぷにゅっとするアニメーションボタン */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }
        .btn-primary:active {
            background-color: var(--accent-hover);
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-complete {
            background-color: var(--accent);
            color: white;
            flex: 2;
        }

        .btn-postpone {
            background-color: #f2f2f7;
            color: var(--text-main);
            flex: 1;
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: #faf9f6;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        .preset-preview {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 6px;
        }

        /* タスクカード */
        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .task-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }
        .badge-today { background: #e8f5e9; color: #2e7d32; }
        .badge-overdue { background: #ffebee; color: #c62828; }
        .badge-future { background: #f1f1f3; color: #555; }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 40px 0;
            font-size: 0.9rem;
        }

        /* カレンダービュー */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-nav button {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-bottom: 16px;
        }
        .cal-day-header {
            font-size: 0.75rem;
            color: var(--text-sub);
            padding: 4px 0;
        }
        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #faf9f6;
            border: 1px solid transparent;
            position: relative;
        }
        .cal-cell.has-task::after {
            content: '';
            width: 5px;
            height: 5px;
            background-color: var(--accent);
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
        }
        .cal-cell.selected {
            border-color: var(--accent);
            font-weight: bold;
        }
        .cal-cell.other-month {
            color: #ccc;
        }

        .delete-text {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">EBBING</div>
        <div class="date-display" id="header-date"></div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('today')">今日の復習</button>
        <button class="tab-btn" onclick="switchTab('calendar')">カレンダー</button>
        <button class="tab-btn" onclick="switchTab('add')">新規作成</button>
        <button class="tab-btn" onclick="switchTab('list')">全タスク</button>
    </div>

    <!-- 今日の復習画面 -->
    <div id="view-today" class="view-section active">
        <div id="today-task-list"></div>
    </div>

    <!-- カレンダー画面 -->
    <div id="view-calendar" class="view-section">
        <div class="card">
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">&lt;</button>
                <span id="cal-month-title" style="font-weight: 600;"></span>
                <button onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
        <div class="card">
            <h3 id="selected-date-title" style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-sub);">日付を選択してください</h3>
            <div id="calendar-day-tasks"></div>
        </div>
    </div>

    <!-- 新規作成画面 -->
    <div id="view-add" class="view-section">
        <div class="card">
            <div class="form-group">
                <label>タスク名</label>
                <input type="text" id="task-name" placeholder="例：英単語 1-50">
            </div>
            <div class="form-group">
                <label>復習間隔プリセット</label>
                <select id="preset-select" onchange="updatePresetPreview()">
                    <option value="standard">スタンダード (1, 3, 7, 14, 30日)</option>
                    <option value="short">短期集中 (1, 2, 4, 7日)</option>
                    <option value="long">じっくり (3, 7, 14, 30, 60日)</option>
                </select>
                <div class="preset-preview" id="preset-preview"></div>
            </div>
            <button class="btn btn-primary" onclick="createTask()">タスクを追加する</button>
        </div>
    </div>

    <!-- 全タスク管理画面 -->
    <div id="view-list" class="view-section">
        <div id="all-task-list"></div>
    </div>

    <script>
        // プリセットの定義
        const presets = {
            standard: [1, 3, 7, 14, 30],
            short: [1, 2, 4, 7],
            long: [3, 7, 14, 30, 60]
        };

        let db = JSON.parse(localStorage.getItem('ebbing_db')) || { tasks: [], history: [] };
        let currentDate = new Date();
        let selectedDateStr = formatDateStr(new Date());

        function saveData() {
            localStorage.setItem('ebbing_db', JSON.stringify(db));
        }

        function formatDateStr(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function addDays(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            date.setDate(date.getDate() + days);
            return formatDateStr(date);
        }

        window.onload = function() {
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-US', options);
            updatePresetPreview();
            renderAll();
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            const index = { today: 0, calendar: 1, add: 2, list: 3 }[tabName];
            document.querySelectorAll('.tab-btn')[index].classList.add('active');
            document.getElementById(`view-${tabName}`).classList.add('active');
            renderAll();
        }

        function updatePresetPreview() {
            const val = document.getElementById('preset-select').value;
            const intervals = presets[val];
            document.getElementById('preset-preview').textContent = `スケジュール: ${intervals.join('日 → ')}日後`;
        }

        function createTask() {
            const nameInput = document.getElementById('task-name');
            const name = nameInput.value.trim();
            if (!name) return alert('タスク名を入力してください');

            const presetKey = document.getElementById('preset-select').value;
            const intervals = presets[presetKey];
            const today = formatDateStr(new Date());

            const newTask = {
                id: Date.now().toString(),
                name: name,
                intervals: intervals,
                currentStep: 1,
                nextDate: addDays(today, intervals[0])
            };

            db.tasks.push(newTask);
            saveData();
            nameInput.value = '';
            switchTab('today');
        }

        function completeTask(id) {
            const task = db.tasks.find(t => t.id === id);
            if (!task) return;

            task.currentStep++;
            if (task.currentStep > task.intervals.length) {
                db.tasks = db.tasks.filter(t => t.id !== id);
            } else {
                const interval = task.intervals[task.currentStep - 1];
                task.nextDate = addDays(formatDateStr(new Date()), interval);
            }
            saveData();
            renderAll();
        }

        function postponeTask(id) {
            const task = db.tasks.find(t => t.id === id);
            if (!task) return;
            task.nextDate = addDays(task.nextDate, 1);
            saveData();
            renderAll();
        }

        function deleteTask(id) {
            if (confirm('このタスクを削除しますか？')) {
                db.tasks = db.tasks.filter(t => t.id !== id);
                saveData();
                renderAll();
            }
        }

        function renderAll() {
            renderToday();
            renderCalendar();
            renderList();
        }

        function renderToday() {
            const container = document.getElementById('today-task-list');
            const today = formatDateStr(new Date());
            const targetTasks = db.tasks.filter(t => t.nextDate <= today);

            if (targetTasks.length === 0) {
                container.innerHTML = `<div class="empty-state">本日の復習タスクはありません。素晴らしい状態です。</div>`;
                return;
            }

            container.innerHTML = targetTasks.map(task => {
                const isOverdue = task.nextDate < today;
                const badgeClass = isOverdue ? 'badge-overdue' : 'badge-today';
                const badgeText = isOverdue ? `期限切れ (${task.nextDate})` : '今日予定';

                return `
                    <div class="card">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <div class="task-title">${escapeHtml(task.name)}</div>
                        <div class="task-meta">
                            <span>段階: ${task.currentStep}回目 / 全${task.intervals.length}回</span>
                        </div>
                        <div class="task-actions">
                            <button class="btn btn-complete" onclick="completeTask('${task.id}')">完了</button>
                            <button class="btn btn-postpone" onclick="postponeTask('${task.id}')">明日に回す</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // カレンダー関連ロジック
        function changeMonth(diff) {
            currentDate.setMonth(currentDate.getMonth() + diff);
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('cal-month-title').textContent = `${year}年 ${month + 1}月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = `
                <div class="cal-day-header">日</div><div class="cal-day-header">月</div>
                <div class="cal-day-header">火</div><div class="cal-day-header">水</div>
                <div class="cal-day-header">木</div><div class="cal-day-header">金</div>
                <div class="cal-day-header">土</div>
            `;

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="cal-cell other-month"></div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const dateStr = `${year}-${mStr}-${dStr}`;
                const hasTask = db.tasks.some(t => t.nextDate === dateStr);
                const isSelected = selectedDateStr === dateStr;

                grid.innerHTML += `
                    <div class="cal-cell ${hasTask ? 'has-task' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDate('${dateStr}')">
                        ${day}
                    </div>
                `;
            }
            renderCalendarDayTasks();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
        }

        function renderCalendarDayTasks() {
            const title = document.getElementById('selected-date-title');
            const container = document.getElementById('calendar-day-tasks');
            title.textContent = `${selectedDateStr} の予定タスク`;

            const tasks = db.tasks.filter(t => t.nextDate === selectedDateStr);
            if (tasks.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 20px 0;">この日に予定されているタスクはありません</div>`;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div style="padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="font-weight: 600; font-size: 0.95rem;">${escapeHtml(task.name)}</div>
                        <div style="font-size: 0.75rem; color: var(--text-sub);">段階: ${task.currentStep}回目</div>
                    </div>
                </div>
            `).join('');
        }

        function renderList() {
            const container = document.getElementById('all-task-list');
            if (db.tasks.length === 0) {
                container.innerHTML = `<div class="empty-state">登録されたタスクはありません。</div>`;
                return;
            }

            container.innerHTML = db.tasks.map(task => `
                <div class="card">
                    <div class="task-title">${escapeHtml(task.name)}</div>
                    <div class="task-meta">
                        <span>次回予定: ${task.nextDate} (${task.currentStep}/${task.intervals.length}回目)</span>
                        <button class="delete-text" onclick="deleteTask('${task.id}')">削除</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&'`<>"]/g, m => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
        }
    </script>
</body>
</html>
