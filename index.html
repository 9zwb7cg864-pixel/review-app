<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECUR - Review Manager</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2b2621;
            --text-sub: #8c8279;
            --border: #e6e2db;
            --accent: #5c4b41;
            --accent-hover: #4a3c34;
            --danger: #c85a53;
            --success: #5a8a62;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-weight: 700;
            color: var(--accent);
        }

        .date-display {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* 統計サマリーパネル */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .stat-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* ナビゲーションタブ */
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 24px;
            background: #ede8e1;
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* カード・UIパーツ */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* アニメーションボタン */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }
        .btn-primary:active {
            background-color: var(--accent-hover);
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-complete {
            background-color: var(--accent);
            color: white;
            flex: 2;
        }

        .btn-postpone {
            background-color: #f2eee9;
            color: var(--text-main);
            flex: 1;
            border: 1px solid var(--border);
        }

        /* 5段階評価パネル */
        .rating-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .rating-prompt {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .rating-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-rate {
            flex: 1;
            padding: 8px 0;
            background: #faf8f5;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-rate:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* グラフ（定着度の視覚化）エリア */
        .chart-container {
            margin-top: 12px;
            padding: 12px;
            background: #faf8f5;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .chart-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 60px;
            padding-top: 10px;
            border-bottom: 1px solid var(--border);
        }

        .chart-bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }

        .chart-bar-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* フォーム要素 */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: #faf8f5;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        /* タスクカード情報 */
        .task-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .task-title:hover {
            color: var(--accent);
        }

        .task-meta {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }
        .badge-today { background: #edf4ee; color: var(--success); }
        .badge-overdue { background: #fdf2f1; color: var(--danger); }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            padding: 30px 0;
            font-size: 0.9rem;
        }

        /* カレンダービュー */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-nav button {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-bottom: 16px;
        }
        .cal-day-header {
            font-size: 0.75rem;
            color: var(--text-sub);
            padding: 4px 0;
        }
        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #faf8f5;
            border: 1px solid transparent;
            position: relative;
        }
        .cal-cell.has-task::after {
            content: '';
            width: 5px;
            height: 5px;
            background-color: var(--accent);
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
        }
        .cal-cell.selected {
            border-color: var(--accent);
            font-weight: bold;
            background: #f2eee9;
        }
        .cal-cell.other-month {
            color: #d1cbc3;
        }

        .delete-text {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 0;
        }

        .preset-tag {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            background: #faf8f5;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">RECUR</div>
        <div class="date-display" id="header-date"></div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('today')">今日</button>
        <button class="tab-btn" onclick="switchTab('calendar')">カレンダー</button>
        <button class="tab-btn" onclick="switchTab('add')">新規作成</button>
        <button class="tab-btn" onclick="switchTab('presets')">間隔設定</button>
        <button class="tab-btn" onclick="switchTab('list')">一覧</button>
    </div>

    <!-- 今日の復習画面 -->
    <div id="view-today" class="view-section active">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">RETENTION</div>
                <div class="stat-value" id="stat-retention">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">BACKLOG</div>
                <div class="stat-value" id="stat-backlog">0</div>
            </div>
        </div>

        <div id="today-task-list"></div>
    </div>

    <!-- カレンダー画面 -->
    <div id="view-calendar" class="view-section">
        <div class="card">
            <div class="calendar-nav">
                <button class="btn" style="width:auto;" onclick="changeMonth(-1)">&lt;</button>
                <span id="cal-month-title" style="font-weight: 600;"></span>
                <button class="btn" style="width:auto;" onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
        <div class="card">
            <h3 id="selected-date-title" style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-sub);">日付を選択してください</h3>
            <div id="calendar-day-tasks"></div>
        </div>
    </div>
