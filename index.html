<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECUR - Smart Interval Review</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f7f4ef;
            --card-bg: #ffffff;
            --text-main: #3e3226;
            --text-sub: #8c7a6b;
            --accent: #b08968;
            --accent-hover: #9c7553;
            --border: #e6dfd5;
            --shadow: rgba(62, 50, 38, 0.04);
            --danger: #d9b8b8;
            --success: #a3b19b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow);
            padding: 24px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .user-info {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
        }

        button.secondary:hover {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* 認証画面 */
        #auth-screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 0;
        }

        #auth-screen input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: var(--bg-color);
            color: var(--text-main);
        }

        .auth-toggle {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            margin-top: 8px;
        }

        .auth-toggle span {
            color: var(--accent);
            font-weight: 600;
        }

        /* アプリ本体 */
        #app-screen {
            display: none;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .task-form input, .task-form select {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: var(--bg-color);
            color: var(--text-main);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            transition: transform 0.2s;
        }

        .task-card:hover {
            border-color: var(--accent);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-title {
            font-weight: 600;
            font-size: 16px;
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-sub);
        }

        .rating-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .rating-btn {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .rating-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ヒートマップ＆統計エリア */
        .dashboard-section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .heatmap-cell {
            aspect-ratio: 1;
            background: var(--bg-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-sub);
            border: 1px solid var(--border);
        }

        .heatmap-cell.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .error-msg {
            color: #b25353;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

            <h1>RECUR</h1>
            <div id="user-status" class="user-info" style="display: none;">
                <span id="user-email-display"></span>
                <button class="secondary" onclick="handleLogout()">ログアウト</button>
            </div>
        </header>

        <!-- ログイン / 新規登録画面 -->
        <div id="auth-screen">
            <p id="auth-title" style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">ログインしてください</p>
            <div id="auth-error" class="error-msg"></div>
            <input type="email" id="auth-email" placeholder="メールアドレス">
            <input type="password" id="auth-password" placeholder="パスワード (6文字以上)">

                アカウントをお持ちでないですか？ <span id="auth-toggle-text">新規登録へ</span>
            </div>
        </div>
